name: employee_portal
description: Employee Portal mobile app integrated with an ERP REST backend.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  intl: ^0.19.0
  google_fonts: ^6.2.1
  pdf: ^3.11.1
  printing: ^5.13.4
  path_provider: ^2.1.4
  open_filex: ^4.5.0
device_frame: ^1.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
